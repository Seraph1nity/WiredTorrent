[package]
name = "wiredtorrent"
version = "0.1.0"
edition = "2024"
description = "Compact command-line BitTorrent downloader"
license = "MIT"

[[bin]]
name = "wiretor"
path = "src/main.rs"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true


[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18.6"
librqbit = "9.0.1"
percent-encoding = "2.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2.5"
webpki-roots = "0.26"
